.rise{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.fade{animation:fade 1s ease-out both}
.stamp{transform-box:fill-box;transform-origin:center;animation:stamp .6s cubic-bezier(.2,1.45,.35,1) both}
.burst{transform-box:fill-box;transform-origin:center;animation:burst 1.2s cubic-bezier(.16,1,.3,1) .45s both}
.draw{transform-box:fill-box;transform-origin:left center;animation:draw 1s cubic-bezier(.65,0,.35,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes stamp{0%{opacity:.45;transform:scale(1.35) rotate(-10deg)}55%{opacity:1}100%{opacity:1;transform:none}}
@keyframes burst{from{opacity:.5;transform:scale(1.12)}to{opacity:1;transform:none}}
@keyframes draw{from{transform:scaleX(0)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.rise,.fade,.stamp,.burst,.draw{animation:none}}
